<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">The industry is converging on spec-first</title>
  <desc id="desc">SpecKit, spec-driven development, and prompt to plan to build pipelines.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 L0 0 0 48" fill="none" stroke="#102033" stroke-width="1" opacity="0.48"/></pattern>
    <radialGradient id="halo" cx="50%" cy="45%" r="70%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/><stop offset="48%" stop-color="#34d399" stop-opacity="0.06"/><stop offset="100%" stop-color="#020617" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#22d3ee" opacity=".9"/></marker>
    <marker id="arrowG" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#34d399" opacity=".9"/></marker>
  </defs>

  <style>
    .bg{fill:#020617}.grid{fill:url(#grid)}.halo{fill:url(#halo)}
    .title{font:800 44px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill:#e5f4ff; letter-spacing:-1.1px}
    .pillText{font:800 32px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill:#e2e8f0; letter-spacing:-.5px}
    .pillTextSmall{font:800 27px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill:#e2e8f0; letter-spacing:-.4px}
    .card{fill:#0f172a;stroke-width:1.9;filter:url(#glow)}
    .cyan{stroke:#22d3ee}.green{stroke:#34d399}.blue{stroke:#38bdf8}.violet{stroke:#a78bfa}.amber{stroke:#fbbf24}.rose{stroke:#fb7185}.slate{stroke:#64748b}
    .line{fill:none;stroke:#22d3ee;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow);opacity:.9;marker-end:url(#arrow)}
    .line2{fill:none;stroke:#34d399;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow);opacity:.85;marker-end:url(#arrowG)}
    .dash{stroke-dasharray:9 8}.check{fill:none;stroke:#34d399;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
  </style>

  <rect class="bg" width="1400" height="788"/>
  <rect class="grid" width="1400" height="788"/>
  <circle class="halo" cx="700" cy="380" r="560"/>
  <text x="90" y="110" class="title">The industry is converging on spec-first</text>
  
  <rect x="95" y="255" width="300" height="115" rx="28" class="card cyan"/><text x="245.0" y="323.5" text-anchor="middle" class="pillText">SpecKit</text>
  <rect x="550" y="255" width="300" height="115" rx="28" class="card green"/><text x="700.0" y="323.5" text-anchor="middle" class="pillTextSmall">Spec-driven dev</text>
  <rect x="1005" y="255" width="300" height="115" rx="28" class="card blue"/><text x="1155.0" y="323.5" text-anchor="middle" class="pillTextSmall">Prompt → Plan → Build</text>
  <path d="M395 313 C455 313 490 313 550 313" class="line"/>
  <path d="M850 313 C910 313 945 313 1005 313" class="line"/>
  <rect x="255" y="500" width="890" height="120" rx="34" class="card amber"/>
  <text x="700" y="573" text-anchor="middle" class="pillText">Spec-first workflows</text>

</svg>