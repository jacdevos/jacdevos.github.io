<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">The proven pattern already exists</title>
  <desc id="desc">BDD, Specification by Example, Cucumber, Gauge, and Markdown specs point to executable contracts.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0 L0 0 0 48" fill="none" stroke="#102033" stroke-width="1" opacity="0.48"/></pattern>
    <radialGradient id="halo" cx="50%" cy="45%" r="70%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/><stop offset="48%" stop-color="#34d399" stop-opacity="0.06"/><stop offset="100%" stop-color="#020617" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#22d3ee" opacity=".9"/></marker>
    <marker id="arrowG" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#34d399" opacity=".9"/></marker>
  </defs>

  <style>
    .bg{fill:#020617}.grid{fill:url(#grid)}.halo{fill:url(#halo)}
    .title{font:700 34px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill:#e5f4ff; letter-spacing:-.7px}
    .subtitle{font:500 16px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill:#94a3b8}
    .pillText{font:700 21px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill:#e2e8f0}
    .small{font:600 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill:#94a3b8}
    .micro{font:600 11px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill:#64748b; letter-spacing:.8px;text-transform:uppercase}
    .card{fill:#0f172a;stroke-width:1.7;filter:url(#glow)}
    .cyan{stroke:#22d3ee}.green{stroke:#34d399}.blue{stroke:#38bdf8}.violet{stroke:#a78bfa}.amber{stroke:#fbbf24}.rose{stroke:#fb7185}.slate{stroke:#64748b}
    .line{fill:none;stroke:#22d3ee;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow);opacity:.9;marker-end:url(#arrow)}
    .line2{fill:none;stroke:#34d399;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow);opacity:.85;marker-end:url(#arrowG)}
    .dash{stroke-dasharray:9 8}.thin{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:.7}.check{fill:none;stroke:#34d399;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
  </style>

  <rect class="bg" width="1400" height="788"/>
  <rect class="grid" width="1400" height="788"/>
  <circle class="halo" cx="700" cy="380" r="560"/>
  <text x="90" y="100" class="title">The proven pattern already exists</text>
  <text x="92" y="132" class="subtitle">BDD, Specification by Example, Cucumber, Gauge, and Markdown specs point to executable contracts.</text>
  
  <text x="90" y="205" class="micro">PROVEN PATTERN</text>
  <rect x="90" y="238" width="270" height="360" rx="26" class="card amber"/>
  <text x="225" y="330" text-anchor="middle" class="pillText">Specification</text>
  <text x="225" y="362" text-anchor="middle" class="pillText">by Example</text>
  <text x="225" y="430" text-anchor="middle" class="small">behaviour as concrete examples</text>
  <text x="225" y="470" text-anchor="middle" class="micro">BOOK / PATTERN</text>
  <rect x="455" y="250" width="235" height="95" rx="24" class="card green"/><text x="489" y="300.5" class="pillText">BDD</text><text x="489" y="322.5" class="small">behaviour-driven</text>
  <rect x="735" y="250" width="235" height="95" rx="24" class="card green"/><text x="769" y="300.5" class="pillText">Cucumber</text><text x="769" y="322.5" class="small">Gherkin scenarios</text>
  <rect x="1015" y="250" width="235" height="95" rx="24" class="card cyan"/><text x="1049" y="300.5" class="pillText">Gauge</text><text x="1049" y="322.5" class="small">Markdown specs</text>
  <path d="M455 485 H690 M735 485 H970 M1015 485 H1250" class="thin" stroke="#22d3ee"/>
  <rect x="455" y="440" width="235" height="95" rx="22" class="card violet"/><text x="572" y="495" text-anchor="middle" class="pillText">Examples</text>
  <rect x="735" y="440" width="235" height="95" rx="22" class="card blue"/><text x="852" y="495" text-anchor="middle" class="pillText">Scenarios</text>
  <rect x="1015" y="440" width="235" height="95" rx="22" class="card rose"/><text x="1132" y="495" text-anchor="middle" class="pillText">CI</text>
  <path d="M1135 465 l16 18 l36 -46" class="check"/>

</svg>