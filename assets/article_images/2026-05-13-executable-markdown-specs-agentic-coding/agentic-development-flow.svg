<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="788" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Spec as prompt to Agent Plan to Agent Build to Run Automated Tests</title>
  <desc id="desc">Spec as prompt, Agent Plan, Agent Build, Run Automated Tests.</desc>
  <defs>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0 L0 0 0 52" fill="none" stroke="#102033" stroke-width="1" opacity="0.44"/></pattern>
    <radialGradient id="halo" cx="50%" cy="45%" r="74%"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.18"/><stop offset="45%" stop-color="#34d399" stop-opacity="0.08"/><stop offset="100%" stop-color="#020617" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,10 L13,5 z" fill="#22d3ee" opacity=".95"/></marker>
  </defs>
  <style>
    .bg{fill:#020617}.grid{fill:url(#grid)}.halo{fill:url(#halo)}
    .title{font:850 56px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill:#e5f4ff; letter-spacing:-1.6px}
    .card{fill:url(#card);stroke-width:2.4;filter:url(#glow)}
    .green{stroke:#34d399}.cyan{stroke:#22d3ee}.blue{stroke:#38bdf8}.violet{stroke:#a78bfa}
    .step{font:850 43px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill:#e2e8f0; letter-spacing:-.9px}
    .stepSmall{font:850 38px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; fill:#e2e8f0; letter-spacing:-.8px}
    .arrow{fill:none;stroke:#22d3ee;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow);opacity:.92;marker-end:url(#arrow)}
    .loop{fill:none;stroke:#34d399;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:12 12;opacity:.62;filter:url(#glow)}
  </style>
  <rect class="bg" width="1400" height="788"/>
  <rect class="grid" width="1400" height="788"/>
  <circle class="halo" cx="700" cy="395" r="610"/>
  <text x="94" y="112" class="title">Spec-driven Agentic Development</text>

  <path d="M270 560 C430 700 965 700 1130 560" class="loop"/>
  <path d="M390 330 L485 330" class="arrow"/>
  <path d="M690 330 L785 330" class="arrow"/>
  <path d="M990 330 L1085 330" class="arrow"/>

  <rect x="95" y="232" width="295" height="196" rx="32" class="card green"/>
  <text x="242.5" y="309" text-anchor="middle" class="stepSmall">Spec as</text>
  <text x="242.5" y="365" text-anchor="middle" class="step">prompt</text>

  <rect x="485" y="232" width="205" height="196" rx="32" class="card cyan"/>
  <text x="587.5" y="309" text-anchor="middle" class="stepSmall">Agent</text>
  <text x="587.5" y="365" text-anchor="middle" class="step">Plan</text>

  <rect x="785" y="232" width="205" height="196" rx="32" class="card blue"/>
  <text x="887.5" y="309" text-anchor="middle" class="stepSmall">Agent</text>
  <text x="887.5" y="365" text-anchor="middle" class="step">Build</text>

  <rect x="1085" y="232" width="265" height="196" rx="32" class="card violet"/>
  <text x="1217.5" y="295" text-anchor="middle" class="stepSmall">Run</text>
  <text x="1217.5" y="345" text-anchor="middle" class="stepSmall">Automated</text>
  <text x="1217.5" y="395" text-anchor="middle" class="stepSmall">Tests</text>

  <text x="700" y="552" text-anchor="middle" class="stepSmall">BDD connects behaviour intent to durable feedback</text>
</svg>
