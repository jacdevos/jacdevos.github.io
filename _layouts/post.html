---
layout: default
---

<div class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-meta">
    <time datetime="{{ page.date }}">{{ page.date | date: "%-d %b '%y" }}</time>
    {% if page.context %}
      <span class="post-context"> | {{ page.context }}</span>
    {% endif %}
  </div>

  {% unless content contains '<img' %}
    {% if page.image and page.image != '/assets/images/jacdevos300x300.png' %}
      <img src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}" {% if page.image_width %}width="{{ page.image_width }}"{% endif %} {% if page.image_height %}height="{{ page.image_height }}"{% endif %} style="display: block; max-width: 100%; height: auto;">
    {% endif %}
  {% endunless %}

  {{ content }}
</div>

<div class="pagination">
  {% if page.next.url %}
    <a href="{{ page.next.url | prepend: site.baseurl }}" class="left arrow">&#8592;</a>
  {% endif %}
  {% if page.previous.url %}
    <a href="{{ page.previous.url | prepend: site.baseurl }}" class="right arrow">&#8594;</a>
  {% endif %}

  <a href="#" class="top">Top</a>
</div>
